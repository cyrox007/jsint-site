name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jsint_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jsint_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      APP_ENV: production
      SECRET_KEY: ci-only-secret-key-that-is-longer-than-thirty-two-characters
      ADMIN_ROUTE_PREFIX: /x321/dashboard
      ADMIN_EMAILS: admin@example.com
      ALLOWED_HOSTS: localhost
      BEHIND_PROXY: "false"
      SESSION_COOKIE_SECURE: "true"
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: jsint_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSLMODE: disable
      REDIS_URL: redis://127.0.0.1:6379/0
      REDIS_REQUIRED: "true"
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      APP_BIND: 127.0.0.1:18080
      GUNICORN_WORKERS: "1"
      GUNICORN_THREADS: "4"
      CELERY_CONCURRENCY: "1"
      YANDEX_METRIKA_ID: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate deployment shell scripts
        run: bash -n deploy/server-preflight.sh deploy/release-lib.sh deploy/install.sh deploy/update.sh

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Production dependency healthcheck
        run: python manage.py health

      - name: Unit and HTTP smoke tests
        run: python -m unittest discover -s tests -v
