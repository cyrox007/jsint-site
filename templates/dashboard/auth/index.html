{% extends '/dashboard/^core/base.html' %}

{% block title %}Вход в панель | jsint cms{% endblock %}

{% block content %}
<div class="login-page">
    <form class="login-form" action="{{ url_for('auth.login') }}" method="post" autocomplete="on">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

        <h1>Вход</h1>
        <p>Введите данные администратора</p>

        <div class="field">
            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="admin@example.com"
                autocomplete="username"
                maxlength="320"
                required>
        </div>

        <div class="field">
            <label for="password">Пароль</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="••••••••"
                autocomplete="current-password"
                maxlength="1024"
                required>
        </div>

        <button type="submit">Войти</button>
    </form>
</div>
{% endblock %}
