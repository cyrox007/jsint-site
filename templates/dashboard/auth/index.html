{% extends '/dashboard/^core/base.html' %}

{% block title %}Авторизация{% endblock %}

{% block content %}

<div class="login-page">

    <form class="login-form"
          action="{{ url_for('auth.login') }}"
          method="post">

        <h1>Вход</h1>

        <p>Введите данные администратора</p>

        <div class="field">
            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="admin@example.com"
                required>
        </div>

        <div class="field">
            <label for="password">Пароль</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="••••••••"
                required>
        </div>

        <button type="submit">
            Войти
        </button>

    </form>

</div>

{% endblock %}
