<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link type="image/png" sizes="16x16" rel="icon" href="{{ url_for('static', filename='favicon/icons8-pastel-glyph-16.png') }}">
    <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='favicon/icons8-pastel-glyph-192.png') }}">
    <link rel="apple-touch-icon" type="image/png" sizes="180x180" href="{{ url_for('static', filename='favicon/icons8-pastel-glyph-180.png') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#060816">

    <title>{% block title %}JSInteractive | +УЛЬТРА{% endblock %}</title>
    <meta name="description" content="{% block description %}+УЛЬТРА — независимая инженерная мини-студия: backend, realtime, аудит и архитектура web-систем.{% endblock %}">
    <meta name="robots" content="{% block robots %}index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1{% endblock %}">
    <link rel="canonical" href="{{ canonical_url or request.base_url }}">

    <meta property="og:locale" content="ru_RU">
    <meta property="og:site_name" content="+УЛЬТРА">
    <meta property="og:type" content="{{ og_type or 'website' }}">
    <meta property="og:title" content="{{ self.title()|striptags|trim }}">
    <meta property="og:description" content="{{ self.description()|striptags|trim }}">
    <meta property="og:url" content="{{ canonical_url or request.base_url }}">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{ self.title()|striptags|trim }}">
    <meta name="twitter:description" content="{{ self.description()|striptags|trim }}">

    <meta name="yandex-verification" content="725d05a47d08b13d">

    <style>
        {% include 'public/styles.css' %}
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% include 'public/^shared/header/index.html' %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% include 'public/^shared/footer/index.html' %}

    {% if config.YANDEX_METRIKA_ID %}
    <script>
        (function (m, e, t, r, i, k, a) {
            m[i] = m[i] || function () { (m[i].a = m[i].a || []).push(arguments) };
            m[i].l = 1 * new Date();
            for (var j = 0; j < document.scripts.length; j++) {
                if (document.scripts[j].src === r) return;
            }
            k = e.createElement(t);
            a = e.getElementsByTagName(t)[0];
            k.async = 1;
            k.src = r;
            a.parentNode.insertBefore(k, a);
        })(window, document, 'script', 'https://mc.yandex.ru/metrika/tag.js?id={{ config.YANDEX_METRIKA_ID|e }}', 'ym');

        ym({{ config.YANDEX_METRIKA_ID|int }}, 'init', {
            ssr: true,
            webvisor: true,
            clickmap: true,
            accurateTrackBounce: true,
            trackLinks: true
        });
    </script>
    <noscript>
        <div>
            <img src="https://mc.yandex.ru/watch/{{ config.YANDEX_METRIKA_ID|e }}"
                 style="position:absolute; left:-9999px;"
                 alt="">
        </div>
    </noscript>
    {% endif %}

    {% block extra_js %}{% endblock %}
</body>
</html>
