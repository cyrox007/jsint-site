<footer>
    <div class="footer-brand">
        <h3>{{ site.name }}</h3>
        {% if site.brand_subtitle %}<p>{{ site.brand_subtitle }}</p>{% endif %}
    </div>
    <div class="footer-links">
        {% if site.github_url %}<a href="{{ site.github_url }}" target="_blank" rel="noopener noreferrer">GitHub</a>{% endif %}
        {% if site.contact_email %}<a href="mailto:{{ site.contact_email }}">Email</a>{% endif %}
    </div>
    <div class="footer-bottom">
        <span>© {{ site.name }}</span>
        {% if site.footer_note %}<span>{{ site.footer_note }}</span>{% endif %}
    </div>
</footer>
