{% set settings = site.settings %}
<header class="navbar">
    <div class="container">
        <div class="navbar-inner">
            <a href="{{ url_for('index') }}" class="logo" aria-label="{{ settings.brand.name }}">
                <img class="logo-mark" src="{{ url_for('static', filename='public/jsinteractive-mark.svg') }}" alt="" width="34" height="34">
                <span class="logo-copy">
                    <strong class="logo-main">{{ settings.brand.name }}</strong>
                    {% if settings.brand.subtitle %}<span class="logo-sub">{{ settings.brand.subtitle }}</span>{% endif %}
                </span>
            </a>

            <nav class="nav-links" aria-label="Основная навигация">
                <a href="{{ url_for('index') }}#systems">Проекты</a>
                <a href="{{ url_for('index') }}#publications">Публикации</a>
                <a href="{{ url_for('index') }}#resume">Опыт</a>
                <a href="{{ url_for('index') }}#about">Обо мне</a>
                <a href="{{ url_for('contact') }}">Контакты</a>
            </nav>

            <div class="nav-actions">
                <a href="{{ url_for('contact') }}" class="nav-cta">
                    <span class="nav-cta__dot" aria-hidden="true"></span>
                    Связаться
                </a>
            </div>
        </div>
    </div>
</header>
