<section id="about">
    <div class="container">
        <h2 class="section-title">{{ site.about_title }}</h2>
        <div class="about-grid">
            <article class="glass-card section-card">
                <h3>{{ site.about_primary_title }}</h3>
                <p>{{ site.about_primary_body }}</p>
            </article>
            <article class="glass-card section-card">
                <h3>{{ site.about_secondary_title }}</h3>
                <p>{{ site.about_secondary_body }}</p>
            </article>
        </div>
    </div>
</section>
