{% set home = site.settings.home %}
<section id="about">
    <div class="container">
        <h2 class="section-title section-title--spaced">{{ home.about_title }}</h2>
        <div class="about-grid">
            {% for card in home.about_cards %}
            <article class="glass-card about-card">
                <h3>{{ card.title }}</h3>
                <p>{{ card.text }}</p>
            </article>
            {% endfor %}
        </div>
    </div>
</section>
