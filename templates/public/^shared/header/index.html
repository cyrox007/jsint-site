<header class="navbar">
    <div class="container">
        <div class="navbar-inner">
            <a href="{{ url_for('index') }}" class="logo">
                <div class="logo-main">{{ site.name }}</div>
                {% if site.brand_subtitle %}<div class="logo-sub">{{ site.brand_subtitle }}</div>{% endif %}
            </a>
            <nav class="nav-links" aria-label="Основная навигация">
                <a href="{{ url_for('index') }}#systems">Материалы</a>
                <a href="{{ url_for('index') }}#philosophy">Подход</a>
                <a href="{{ url_for('index') }}#about">О проекте</a>
            </nav>
            {% if site.contact_email %}
            <div class="nav-actions"><a href="mailto:{{ site.contact_email }}" class="nav-cta">Связаться</a></div>
            {% endif %}
        </div>
    </div>
</header>
